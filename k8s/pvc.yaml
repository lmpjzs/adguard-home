apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-home-work-pvc
  labels:
    app: adguard-home
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-home-conf-pvc
  labels:
    app: adguard-home
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
